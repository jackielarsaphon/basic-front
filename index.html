<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <h1 class="page-title">To-Do List</h1>

    <section class="card">
      <h2 class="card-title">งานที่ต้องทำวันนี้</h2>

      <!-- ฟอร์มสำหรับเพิ่มงานใหม่ -->
      <form class="add-form" id="add-form" autocomplete="off">
        <input
          type="text"
          id="task-input"
          class="task-input"
          placeholder="เพิ่มงานใหม่"
          maxlength="120"
        />
        <button type="submit" class="add-button">เพิ่ม</button>
      </form>
      <p class="error-message" id="error-message"></p>

      <!-- รายการงานทั้งหมด -->
      <ul class="task-list" id="task-list"></ul>

      <p class="empty-state" id="empty-state">ยังไม่มีงานในตอนนี้ ลองเพิ่มงานใหม่ดูสิ</p>

      <footer class="card-footer">
        <span id="task-count">ทั้งหมด 0 งาน</span>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
